<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心</title>
<style>
html, body { margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

.page {
  min-height: 100vh;
  background: #f2f4f8;
}

/* 头部：column 方向（默认），align-items 交叉轴居中 */
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10.6667vw 5.3333vw 7.4667vw;
  background: linear-gradient(135deg, #1F3A8C 0%, #07A35A 100%);
}

.avatar {
  width: 18.6667vw;
  height: 18.6667vw;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2.6667vw;
}

.avatar-text {
  font-size: 8.0000vw;
  color: #fff;
  font-weight: bold;
}

.nickname {
  font-size: 5.0667vw;
  color: #fff;
  font-weight: bold;
  margin-bottom: 2.4000vw;
}

.tags {
  display: flex;
  flex-direction: row;
}

.tag {
  font-size: 2.9333vw;
  color: #fff;
  background: rgba(255, 255, 255, 0.22);
  padding: 1.0667vw 3.2000vw;
  border-radius: 3.2000vw;
  margin: 0 1.0667vw;
}

/* 概览卡：向上偏移压住头部；三列 flex:1 等宽 */
.stats {
  display: flex;
  flex-direction: row;
  margin: -4.2667vw 3.2000vw 0;
  background: #fff;
  border-radius: 2.6667vw;
  box-shadow: 0 1.0667vw 3.2000vw rgba(31, 58, 140, 0.10);
}

.stat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 3.7333vw 0;
}

.stat-num {
  font-size: 4.8000vw;
  font-weight: bold;
  color: #1F3A8C;
}

.stat-label {
  font-size: 3.2000vw;
  color: #8a909c;
  margin-top: 1.0667vw;
}

/* 菜单：每行 row，文字 flex:1 占满，箭头挤到最右 */
.menu {
  margin: 3.2000vw;
  background: #fff;
  border-radius: 2.6667vw;
  padding: 0 3.7333vw;
}

.menu-item {
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 4.5333vw 0;
  border-bottom: 0.1333vw solid #eef0f4;
}

.menu-item.noBorder {
  border-bottom: none;
}

.menu-dot {
  width: 2.1333vw;
  height: 2.1333vw;
  border-radius: 50%;
  background: #1F3A8C;
  margin-right: 2.9333vw;
}

.menu-text {
  flex: 1;
  font-size: 4.0000vw;
  color: #222a35;
}

.menu-arrow {
  font-size: 4.8000vw;
  color: #c0c4cc;
}

</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="avatar"><span class="avatar-text">开</span></div>
    <span class="nickname">开发者小王</span>
    <div class="tags"><span class="tag">UniApp 达人</span><span class="tag">前端工程师</span></div>
  </div>
  <div class="stats"><div class="stat"><span class="stat-num">128h</span><span class="stat-label">学习时长</span></div><div class="stat"><span class="stat-num">7</span><span class="stat-label">完成实验</span></div><div class="stat"><span class="stat-num">12</span><span class="stat-label">获得勋章</span></div></div>
  <div class="menu"><div class="menu-item"><span class="menu-dot"></span><span class="menu-text">我的课程</span><span class="menu-arrow">&#8250;</span></div><div class="menu-item"><span class="menu-dot"></span><span class="menu-text">学习进度</span><span class="menu-arrow">&#8250;</span></div><div class="menu-item"><span class="menu-dot"></span><span class="menu-text">成就勋章</span><span class="menu-arrow">&#8250;</span></div><div class="menu-item"><span class="menu-dot"></span><span class="menu-text">消息通知</span><span class="menu-arrow">&#8250;</span></div><div class="menu-item noBorder"><span class="menu-dot"></span><span class="menu-text">设置</span><span class="menu-arrow">&#8250;</span></div></div>
</div>
</body>
</html>
